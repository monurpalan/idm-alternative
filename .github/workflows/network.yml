name: Network tests

# The tests that need the Internet (`#[ignore]`d in the normal run): Twitch through yt-dlp,
# GitHub's API and releases (yt-dlp and ffmpeg set up, yt-dlp updated), a real torrent. Sites
# change, so this runs on its own: weekly and by hand. A failure only shows red here.
#
# YouTube asks CI machines to sign in ("confirm you're not a bot"), so its tests are left out
# here; run them on a desktop: cargo test --workspace -- --ignored youtube
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  network:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The app's GTK/WebKit stack (its tests are among them), BoringSSL's CMake and libclang,
      # and ffmpeg for the tests that join or record video.
      - name: System libraries and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev libdbus-1-dev cmake clang libclang-dev pkg-config ffmpeg
      - name: yt-dlp and deno
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          curl -fsSL -o yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          curl -fsSL -o deno.zip https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip
          unzip -q deno.zip && rm deno.zip
          chmod +x yt-dlp deno
          echo "SHARDLOAD_TOOLS=$RUNNER_TEMP/tools" >> "$GITHUB_ENV"
          # An older yt-dlp for the update test to replace.
          mkdir -p "$RUNNER_TEMP/old/tools"
          old=https://github.com/yt-dlp/yt-dlp/releases/download/2024.08.06/yt-dlp_linux
          curl -fsSL -o "$RUNNER_TEMP/old/tools/yt-dlp" "$old"
          chmod +x "$RUNNER_TEMP/old/tools/yt-dlp"
          echo "SHARDLOAD_TOOLS_TEST=$RUNNER_TEMP/old" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      # The app embeds the built web UI at compile time.
      - name: Web UI
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Network tests
        run: |
          skip="--skip youtube --skip without_ffmpeg_a_page_is_one_file_with_sound"
          cargo test --workspace --no-fail-fast -- --ignored $skip

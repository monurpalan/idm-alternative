name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # wreq builds BoringSSL: CMake and LLVM (libclang) are preinstalled, NASM is not.
      - name: Install NASM
        run: |
          choco install nasm -y --no-progress
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            extension/package-lock.json
      # The app embeds the built web UI at compile time, so it is built before any cargo step.
      - name: Web UI
        working-directory: app
        run: |
          npm ci
          npm run check
          npm run i18n
          npm run build
      - name: Browser extension
        working-directory: extension
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: File size
        run: node scripts/check-size.mjs
      - name: Test
        run: cargo test --workspace

  # The app's flows driven over WebView2's DevTools Protocol, against the test server (see
  # app/ui-test/run.mjs); the screenshots go up as an artifact.
  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install NASM
        run: |
          choco install nasm -y --no-progress
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Web UI
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Build the app, the test server and the native host
        run: |
          cargo build
          cargo build -p shardload-app
      - name: WebView2 runtime
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          (Get-ItemProperty $key -ErrorAction SilentlyContinue).pv
      - name: UI flows
        working-directory: app
        run: npm run ui-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: app/ui-test/out

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Tauri's GTK/WebKit stack and tray; wreq's BoringSSL needs CMake and libclang.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev cmake clang libclang-dev patchelf file zsync vsftpd openssh-server
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            extension/package-lock.json
      - name: Web UI
        working-directory: app
        run: |
          npm ci
          npm run build
      # The extension in Chrome for Testing, with a stand-in for the app (see e2e/run.mjs).
      - name: Browser extension, end to end
        working-directory: extension
        run: |
          npm ci
          npm run build
          npm run e2e
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: File size
        run: node scripts/check-size.mjs
      # vsftpd and OpenSSH for crates/engine/tests/real_servers.rs.
      - name: Real FTPS and SSH servers
        run: |
          sudo sh scripts/real-servers/setup.sh "$RUNNER_TEMP/real-servers"
          echo "SHARDLOAD_REAL_SERVERS=$RUNNER_TEMP/real-servers" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --workspace
      - name: Packages (.deb, .rpm, AppImage)
        working-directory: app
        run: npm run bundle -- --bundles deb,rpm,appimage
      # Each package, installed or run as it comes, on a virtual display: the window loads,
      # the bridge socket is there, and a download through the MCP server works.
      - name: Smoke test of the packages
        working-directory: app
        run: |
          sudo apt-get install -y --no-install-recommends xvfb xauth
          sudo apt-get install -y ../target/release/bundle/deb/*.deb
          xvfb-run -a node scripts/linux-smoke.mjs shardload shardload-mcp ../target/debug/testserver
          image=$(ls ../target/release/bundle/appimage/*.AppImage)
          chmod +x "$image"
          xvfb-run -a node scripts/linux-smoke.mjs             "APPIMAGE_EXTRACT_AND_RUN=1 exec $image" shardload-mcp ../target/debug/testserver
      # The .rpm installed with dnf on Fedora (which brings what it requires), and the same
      # smoke test, as a user.
      - name: Smoke test of the .rpm on Fedora
        run: |
          rpm=$(ls target/release/bundle/rpm/*.rpm)
          docker run --rm -v "$PWD:/w" fedora:41 bash -euc "
            dnf install -y -q /w/$rpm xorg-x11-server-Xvfb xorg-x11-xauth nodejs > /dev/null
            rpm -qpR /w/$rpm | grep -v '^rpmlib'
            useradd -m smoke
            cp /w/target/debug/testserver /home/smoke/testserver
            su smoke -c 'cd /w/app && xvfb-run -a node scripts/linux-smoke.mjs shardload shardload-mcp /home/smoke/testserver'"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: linux-testserver
          path: target/debug/testserver
          if-no-files-found: error

  # Every fuzz target for a short while (fuzz/; the long runs are local), on nightly.
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang libclang-dev libdbus-1-dev pkg-config
      - name: Build the targets
        working-directory: fuzz
        run: cargo +nightly fuzz build -O
      - name: Run each target for 45 s
        working-directory: fuzz
        run: |
          for target in $(cargo +nightly fuzz list); do
            echo "::group::$target"
            mkdir -p "corpus/$target"
            cargo +nightly fuzz run -O "$target" "corpus/$target" "seeds/$target" -- \
              -max_total_time=45 -rss_limit_mb=2048 -timeout=10
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  # Which lines the tests run, per file (crates/*; the app shell needs a window). A report to
  # read, not a gate: no threshold.
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml, with the LLVM tools
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang libclang-dev libdbus-1-dev libssl-dev pkg-config
      - name: Tests with coverage
        run: |
          cargo llvm-cov --no-report
          cargo llvm-cov report --html --output-dir coverage
          cargo llvm-cov report --lcov --output-path coverage/lcov.info
          cargo llvm-cov report --summary-only | tee coverage/summary.txt
          {
            echo '### Line coverage'
            echo '```'
            tail -n 1 coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: error

  # The Flatpak, made from the .deb (see packaging/flatpak), installed and smoke-tested.
  flatpak:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: packages
      - uses: actions/download-artifact@v4
        with:
          name: linux-testserver
          path: testserver
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the bundle
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder xvfb xauth dbus
          packaging/flatpak/build.sh packages/deb/*.deb packages/flatpak/Shardload.flatpak
      - name: Smoke test of the Flatpak
        run: |
          flatpak install --user -y --noninteractive packages/flatpak/Shardload.flatpak
          chmod +x testserver/testserver
          cd app
          dbus-run-session -- xvfb-run -a node scripts/linux-smoke.mjs             "exec flatpak run --filesystem=/tmp io.github.monurpalan.Shardload"             "exec flatpak run --filesystem=/tmp --command=shardload-mcp io.github.monurpalan.Shardload"             ../testserver/testserver
      - uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak
          path: packages/flatpak/Shardload.flatpak
          if-no-files-found: error

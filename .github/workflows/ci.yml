name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # wreq builds BoringSSL: CMake and LLVM (libclang) are preinstalled, NASM is not.
      - name: Install NASM
        run: |
          choco install nasm -y --no-progress
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            extension/package-lock.json
      # The app embeds the built web UI at compile time, so it is built before any cargo step.
      - name: Web UI
        working-directory: app
        run: |
          npm ci
          npm run check
          npm run i18n
          npm run build
      - name: Browser extension
        working-directory: extension
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: File size
        run: node scripts/check-size.mjs
      - name: Test
        run: cargo test --workspace

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Tauri's GTK/WebKit stack and tray; wreq's BoringSSL needs CMake and libclang.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev cmake clang libclang-dev patchelf file
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            extension/package-lock.json
      - name: Web UI
        working-directory: app
        run: |
          npm ci
          npm run build
      # The extension in Chrome for Testing, with a stand-in for the app (see e2e/run.mjs).
      - name: Browser extension, end to end
        working-directory: extension
        run: |
          npm ci
          npm run build
          npm run e2e
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: File size
        run: node scripts/check-size.mjs
      - name: Test
        run: cargo test --workspace
      - name: Packages (.deb, AppImage)
        working-directory: app
        run: npm run bundle -- --bundles deb,appimage
      # Each package, installed or run as it comes, on a virtual display: the window loads,
      # the bridge socket is there, and a download through the MCP server works.
      - name: Smoke test of the packages
        working-directory: app
        run: |
          sudo apt-get install -y --no-install-recommends xvfb xauth
          sudo apt-get install -y ../target/release/bundle/deb/*.deb
          xvfb-run -a node scripts/linux-smoke.mjs shardload shardload-mcp ../target/debug/testserver
          image=$(ls ../target/release/bundle/appimage/*.AppImage)
          chmod +x "$image"
          xvfb-run -a node scripts/linux-smoke.mjs             "APPIMAGE_EXTRACT_AND_RUN=1 exec $image" shardload-mcp ../target/debug/testserver
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

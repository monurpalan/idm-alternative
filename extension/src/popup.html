<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="color-scheme" content="light dark" />
		<title>Shardload</title>
		<link rel="stylesheet" href="ui.css" />
		<style>
			body {
				width: 360px;
			}
			h1 {
				padding: var(--space-3);
				border-bottom: 1px solid var(--line);
			}
			ul {
				max-height: 384px;
				margin: 0;
				padding: 0;
				overflow-y: auto;
				list-style: none;
			}
			li {
				display: grid;
				grid-template-columns: auto 1fr auto;
				gap: var(--space-2);
				align-items: center;
				padding: var(--space-2) var(--space-3);
				border-bottom: 1px solid var(--line-soft);
			}
			.kind {
				padding: 0 var(--space-1);
				border-radius: var(--radius-1);
				background: var(--selected);
				font-size: var(--text-caption);
				font-weight: 600;
			}
			.name {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.size {
				display: block;
			}
			p {
				padding: var(--space-4) var(--space-3);
			}
		</style>
	</head>
	<body>
		<h1>Media on this page</h1>
		<ul id="list"></ul>
		<p id="empty" class="muted" hidden>No video or audio found yet. Start playing it, then open this again.</p>
		<p id="error" class="error" hidden></p>
		<script src="popup.js"></script>
	</body>
</html>

<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="color-scheme" content="light dark" />
		<title>idm-alternative</title>
		<link rel="stylesheet" href="ui.css" />
		<style>
			body {
				max-width: 560px;
				padding: var(--space-4);
			}
			form {
				display: flex;
				flex-direction: column;
				gap: var(--space-1);
				margin-top: var(--space-3);
			}
			label {
				margin-top: var(--space-2);
			}
			.check {
				display: flex;
				gap: var(--space-2);
				align-items: center;
				margin-top: 0;
			}
			textarea {
				height: 64px;
			}
			.buttons {
				display: flex;
				gap: var(--space-2);
				align-items: center;
				margin-top: var(--space-4);
			}
		</style>
	</head>
	<body>
		<p id="status" class="muted">Checking the connection to the app…</p>
		<form id="form">
			<label class="check"><input type="checkbox" id="enabled" /> Hand downloads to idm-alternative</label>
			<label for="min">Leave downloads smaller than this to the browser (KB)</label>
			<input type="number" id="min" min="0" placeholder="no minimum" />
			<label for="extensions">File types to take over</label>
			<textarea id="extensions"></textarea>
			<small class="caption">Separated by spaces. Empty: every download.</small>
			<label for="excluded">Never take downloads from these sites</label>
			<textarea id="excluded" placeholder="example.com"></textarea>
			<small class="caption">One per line; subdomains included. Hold Alt while clicking to skip once.</small>
			<div class="buttons">
				<button type="submit" class="primary">Save</button>
				<button type="button" id="reset">Defaults</button>
				<span id="saved" class="muted"></span>
			</div>
		</form>
		<script src="options.js"></script>
	</body>
</html>

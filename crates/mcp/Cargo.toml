[package]
name = "shardload-mcp"
description = "MCP server: lets an AI assistant add, list, pause, resume and remove downloads in the app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "shardload-mcp"
path = "src/main.rs"

[dependencies]
shardload-bridge = { path = "../bridge" }
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true

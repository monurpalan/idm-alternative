[package]
name = "shardload-manager"
description = "Download list, queue and persistence on top of the engine; what the app and the native host talk to"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
futures-util.workspace = true
base64 = "0.22"
shardload-engine = { path = "../engine" }
# 9.1.0 or later: 9.0.1's DHT stops for good on Windows at the first ICMP "port unreachable"
# (WSAECONNRESET), within seconds (ikatson/rqbit#690).
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url = "2"
httpdate = "1"
fs4 = "1.1.0"
aes-gcm = "0.10"
getrandom = "0.3"
tar = { version = "0.4", default-features = false }
flate2 = "1.1"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }

[dev-dependencies]
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz", "encoder"] }
tracing-subscriber.workspace = true
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
shardload-testserver = { path = "../testserver" }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json.workspace = true
sha1 = "0.11.0"
sha2 = "0.11.1"

[lints]
workspace = true

# Linux keeps the key that encrypts secrets in the Secret Service (GNOME Keyring, KWallet), over
# the D-Bus library Tauri's tray already links.
[target."cfg(target_os = \"linux\")".dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[package]
name = "idma-manager"
description = "Download list, queue and persistence on top of the engine; what the app and the native host talk to"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
futures-util.workspace = true
base64 = "0.22"
idma-engine = { path = "../engine" }
# rqbit's main branch until a release after 9.0.1: 9.0.1's DHT stops for good on Windows at the
# first ICMP "port unreachable" (WSAECONNRESET), within seconds (ikatson/rqbit#690).
librqbit = { git = "https://github.com/ikatson/rqbit", rev = "57e95d16c8", default-features = false, features = ["rust-tls"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url = "2"

[dev-dependencies]
tracing-subscriber.workspace = true
librqbit = { git = "https://github.com/ikatson/rqbit", rev = "57e95d16c8", default-features = false, features = ["rust-tls"] }
idma-testserver = { path = "../testserver" }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json.workspace = true

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

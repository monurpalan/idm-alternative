[package]
name = "shardload-engine"
description = "Segmented, resumable HTTP download engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
quick-xml = "0.42"
futures-util.workspace = true
wreq = { version = "0.16.1", features = ["stream", "cookies", "socks"] }
wreq-util = "0.2.0"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = "0.7"
tracing.workspace = true
fs4 = "1.1.0"
md-5 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
base64 = "0.22"
aes = "0.9.3"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
url = "2"
crc32fast = "1.5"
flate2 = "1.1"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
shardload-media = { version = "0.1.6", path = "../media" }
# FTP and FTPS, and SFTP (see `protocol`).
suppaftp = { version = "12.2", features = ["tokio-rustls-ring", "deprecated"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.7"
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0"

[target.'cfg(unix)'.dependencies]
xattr = "1.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_IO",
  "Win32_System_Ioctl",
] }

[dev-dependencies]
shardload-testserver = { path = "../testserver" }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.11.1"
shardload-media = { path = "../media" }

[lints]
workspace = true

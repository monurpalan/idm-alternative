# Benchmark configuration for `cargo run --release -p shardload-bench`.
#
# Placeholders in `args`: {url}, {dir}, {file}, {path}.
# `${VAR}` in `program` expands environment variables.
# Write downloads to an SSD (`--out-dir`): on an HDD, many connections writing one file
# measure seek time, not the client.
# Every run gets a unique URL, so server-side counters never mix between runs.

repeat = 1 # use --repeat 3 for published results
timeout_secs = 300

# ---------------------------------------------------------------- clients

[[client]]
name = "curl"
program = "curl.exe"
args = ["-s", "-f", "-o", "{path}", "{url}"]

[[client]]
name = "aria2 x16"
program = "aria2c"
args = [
  "-x16", "-s16", "-k1M", "--file-allocation=falloc",
  # No fallback to IPv4 when an IPv6 address is unreachable (the others fall back):
  "--disable-ipv6=true",
  "--allow-overwrite=true", "--auto-file-renaming=false",
  "--console-log-level=error", "--summary-interval=0", "--download-result=hide",
  "-d", "{dir}", "-o", "{file}", "{url}",
]

[[client]]
name = "shard"
program = "${CARGO_TARGET_DIR}/release/shard.exe"
args = ["get", "{url}", "-o", "{path}"]

# Same connection count as IDM's default, for a like-for-like comparison.
[[client]]
name = "shard x8"
program = "${CARGO_TARGET_DIR}/release/shard.exe"
args = ["get", "{url}", "-o", "{path}", "-c", "8"]
enabled = false

# IDM 6.43 (default settings: 8 connections). /n = silent, /q = exit when done -- but /q only
# works for the first instance: close IDM (tray icon included) before benchmarking, or the
# command hands the download to the running copy and returns at once. Checked 2026-10-16:
# exits after the download and the file verifies, but with exit code 1 even on success (a
# failed download never exits; the timeout catches it).
[[client]]
name = "IDM"
program = "C:/Program Files (x86)/Internet Download Manager/IDMan.exe"
args = ["/d", "{url}", "/p", "{dir}", "/f", "{file}", "/n", "/q"]
ignore_exit_code = true

# Gopeed and AB Download Manager are driven through the running app (see bench/README.md):
# the scripts add the download and exit when the app reports it done. Off by default.
[[client]]
name = "Gopeed"
program = "python"
args = ["-I", "bench/clients/gopeed.py", "{url}", "{path}"]
enabled = false

# Gopeed 2.0 beta, its server on port 9998 (the stable 1.9.3 on 9999).
[[client]]
name = "Gopeed 2.0β"
program = "python"
args = ["-I", "bench/clients/gopeed.py", "{url}", "{path}", "http://127.0.0.1:9998"]
enabled = false

[[client]]
name = "AB DM"
program = "python"
args = ["-I", "bench/clients/abdm.py", "{url}", "{path}"]
enabled = false

# ---------------------------------------------------------------- scenarios
# `query` is appended to `size` and `seed`; see crates/testserver/README.md.

[[scenario]]
name = "clean"
description = "Fast local server, no limits: raw engine and disk throughput"
size = "1G"

[[scenario]]
name = "per-conn-limit"
description = "Each connection capped at 4 MiB/s: rewards parallelism"
size = "256M"
query = "rate=4M"

[[scenario]]
name = "slow-tail"
description = "One connection crawls at 64 KiB/s: does the client rescue its range?"
size = "256M"
query = "rate=8M&slow_conn=3:64K"

[[scenario]]
name = "conn-cap"
description = "Server allows 4 connections and answers 503 beyond that"
size = "256M"
query = "rate=8M&max_conns=4"

[[scenario]]
name = "flaky"
description = "Every response is reset after 4 MiB: retry and resume"
size = "256M"
query = "rate=16M&drop_after=4M"

[[scenario]]
name = "no-ranges"
description = "Server has no range support: single connection only"
size = "128M"
query = "ranges=off&rate=16M"

[[scenario]]
name = "fake-ranges"
description = "Advertises ranges but always returns 200 + full file"
size = "128M"
query = "range_as_200=1&rate=16M"

# ---------------------------------------------------------------- internet
# Scenarios added to look for where shard loses (2026-10-18): conditions that do not reward
# many connections or that punish them.

[[scenario]]
name = "per-client-limit"
description = "16 MiB/s for all connections together, like a per-IP limit: more connections do not help"
size = "128M"
query = "total_rate=16M"

[[scenario]]
name = "conn-ban"
description = "Server forbids (403) every connection beyond 4"
size = "256M"
query = "rate=8M&max_conns=4&refuse_status=403"

[[scenario]]
name = "high-latency"
description = "300 ms before every response, 4 MiB/s per connection: each extra request costs"
size = "64M"
query = "latency_ms=300&rate=4M"

[[scenario]]
name = "tiny"
description = "A 256 KiB file: what a download costs before any data moves"
size = "256K"

# Off by default (a plain run stays offline); select with --scenario internet.
# Checked 2026-10-16 from Turkey: Hetzner's speed-test hosts reset the TLS connection,
# Tele2 does not answer, Leaseweb's files are gone, and proof.ovh.net stopped accepting
# connections from this IP minutes into the first run (16 + 8 connections per download).

[[scenario]]
name = "internet-linode-1g"
description = "Linode Frankfurt speed test, 1000 MiB, real internet"
size = "1000M"
url = "https://speedtest.frankfurt.linode.com/1GB-frankfurt.bin"
enabled = false

[[scenario]]
name = "internet-linode-100m"
description = "Linode Frankfurt speed test, 100 MiB, real internet"
size = "100M"
url = "https://speedtest.frankfurt.linode.com/100MB-frankfurt.bin"
enabled = false

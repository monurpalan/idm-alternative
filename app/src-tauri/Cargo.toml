[package]
name = "idma-app"
description = "Desktop app: a Tauri shell over idma-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "idm-alternative"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
idma-engine = { version = "0.1.0", path = "../../crates/engine" }
idma-manager = { path = "../../crates/manager" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

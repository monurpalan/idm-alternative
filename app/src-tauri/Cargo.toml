[package]
name = "shardload-app"
description = "Desktop app: a Tauri shell over shardload-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "shardload"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4.45"
shardload-bridge = { version = "0.1.1", path = "../../crates/bridge" }
shardload-engine = { version = "0.1.1", path = "../../crates/engine" }
shardload-manager = { path = "../../crates/manager" }
shardload-media = { version = "0.1.1", path = "../../crates/media" }
lzma-rs = { version = "0.3", default-features = false }
serde.workspace = true
serde_json.workspace = true
tar = { version = "0.4.46", default-features = false }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio.workspace = true
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber.workspace = true
url = "2"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Power", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true

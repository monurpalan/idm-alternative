[package]
name = "idma-app"
description = "Desktop app: a Tauri shell over idma-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "idm-alternative"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4.45"
idma-bridge = { version = "0.1.0", path = "../../crates/bridge" }
idma-engine = { version = "0.1.0", path = "../../crates/engine" }
idma-manager = { path = "../../crates/manager" }
idma-media = { version = "0.1.0", path = "../../crates/media" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio.workspace = true
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber.workspace = true
url = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Power", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }

[lints]
workspace = true
